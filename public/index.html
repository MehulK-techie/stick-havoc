<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>Stick Havoc</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<!-- in a match -->
<div id="info" class="panel hidden">
  <div class="label" id="iMode"></div>
  <div class="title" id="iMap"></div>
  <div class="sub" id="iRound"></div>
  <button id="iEnd" class="hidden" title="Host: end the match, everyone back to the lobby">Back to lobby</button>
</div>
<div id="board" class="panel hidden"><div class="label" id="bTitle">Next up</div><ol id="bList"></ol></div>
<div id="emojis" class="panel hidden">
  <button data-e="🔥" title="Hype (5)">🔥</button><button data-e="💀" title="R.I.P. (6)">💀</button>
  <button data-e="🤡" title="Fail (7)">🤡</button><button data-e="🚀" title="Yeet (8)">🚀</button>
</div>
<div id="vote" class="panel hidden">
  <div class="q"><span id="vq">Crowd vote</span> <span id="vt" class="label"></span></div>
  <button id="v0"></button><button id="v1"></button>
  <div class="bar" id="vbar"></div>
</div>

<!-- always -->
<div id="commands" class="panel"></div>
<div id="feed"></div>
<div id="toast" class="panel hidden"></div>
<div id="rotate" class="panel">Turn your phone sideways</div>

<!-- the wardrobe -->
<aside id="drawer" class="panel" aria-label="Wardrobe">
  <h2>Wardrobe</h2>
  <p class="sub">Everyone sees the change at once.</p>
  <section><span class="label">Name</span><input id="dName" maxlength="16" autocomplete="off" spellcheck="false"></section>
  <section><span class="label">Colour</span><div class="swatches" id="dColors"></div></section>
  <section><span class="label">Headgear</span><div class="chips" id="dHats"></div></section>
  <section><span class="label">Dash trail</span><div class="chips" id="dTrails"></div></section>
  <button id="dDone">Done <kbd>Esc</kbd></button>
</aside>

<div id="touch" class="hidden">
  <div class="pad l">
    <span></span><button data-k="4">▲</button><span></span>
    <button data-k="1">◀</button><button data-k="8">▼</button><button data-k="2">▶</button>
  </div>
  <div class="pad r">
    <button data-use="1" title="Use">E</button><button data-k="32" title="Punch">J</button><button data-k="64" title="Launcher">K</button>
    <span></span><button data-k="128" title="Dash">L</button><button data-k="16" title="Jump">⤒</button>
  </div>
</div>

<script src="physics.js"></script>
<script src="audio.js"></script>
<script src="hud.js"></script>
<script src="lobby.js"></script>
<script src="engine.js"></script>
</body>
</html>
